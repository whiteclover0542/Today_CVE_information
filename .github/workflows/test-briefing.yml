name: (Temp) Test Briefing

# 오늘의 브리핑 기능을 실 데이터(data/history.json)는 건드리지 않고 한 번 검증하기 위한 임시 워크플로.
# 확인 끝나면 이 파일과 scripts/test-briefing.mjs, tmp-briefing-test-output.json을 함께 삭제한다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate briefing from today's stored stats (read-only against history.json)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/test-briefing.mjs

      - name: Commit test output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp-briefing-test-output.json
          git diff --cached --quiet || git commit -m "test: 브리핑 생성 결과 확인용 임시 출력"
          git push
